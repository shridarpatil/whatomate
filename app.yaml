name: whatomate
region: nyc

services:
  - name: web
    github:
      repo: mayankmishra0403/whatomate
      branch: deploy/do-app
      deploy_on_push: true
    source_dir: /
    dockerfile_path: docker/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: TZ
        value: UTC
      - key: POSTGRES_USER
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: POSTGRES_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: POSTGRES_DB
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: APP_NAME
        scope: RUN_TIME
        value: whatomate
      - key: APP_ENV
        scope: RUN_TIME
        value: production
