services:
  # Ritam Bharat app
  app:
    image: shridh0r/ritam-bharat:latest
    container_name: ritam_bharat_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - ritam-bharat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: ritam_bharat_db
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritam_bharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritam_bharat}
      POSTGRES_DB: ${POSTGRES_DB:-ritam_bharat}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ritam_bharat} -d ${POSTGRES_DB:-ritam_bharat}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ritam_bharat_redis
    restart: unless-stopped
    networks:
      - ritam-bharat
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  ritam-bharat:

volumes:
  postgres-data:
  redis-data:
