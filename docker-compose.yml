services:
  # Whatomate app
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ritam_bharat_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - ritam-bharat
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["./ritam-bharat", "server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    networks:
      - ritam-bharat
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritam_bharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritam_bharat}
      POSTGRES_DB: ${POSTGRES_DB:-ritam_bharat}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ritam_bharat} -d ${POSTGRES_DB:-ritam_bharat}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    networks:
      - ritam-bharat
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  ritam-bharat:

volumes:
  postgres-data:
  redis-data:
