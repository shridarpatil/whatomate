name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The docs take the app's theme variables and fonts from these.
      - 'frontend/src/assets/theme.css'
      - 'frontend/src/assets/fonts.css'
      - 'frontend/src/assets/fonts/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # oatdocs: a small Go docs generator, no npm. The version is pinned and
      # Go's checksum database verifies its source.
      - name: Build docs
        run: go run github.com/shridarpatil/oatdocs@v0.2.1 build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
